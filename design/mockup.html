<!doctype html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPT Share</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
:root{
  color-scheme:light;
  --bg:#eceef2; --panel:#ffffff; --side:#f5f6f8; --line:#d8dce3; --line-soft:#e6e9ee;
  --text:#141821; --muted:#5a6272; --faint:#8a92a1;
  --accent:#1f5fe0; --accent-ink:#ffffff; --accent-soft:#e3ebfd;
  --live:#d92d20; --live-soft:#fde8e6; --ok:#12804a; --warn:#a15c00; --warn-soft:#fdf0d9;
  --btn:#f0f2f6; --btn-h:#e5e8ee; --btn-a:#d9dde5;
  --stage:#d5d9e0; --shadow:0 1px 2px rgba(31,60,120,.10),0 4px 14px rgba(31,60,120,.08);
  --sel:#c9dafc;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c0e12; --panel:#14171d; --side:#101319; --line:#262b34; --line-soft:#1d2129;
  --text:#e7e9ee; --muted:#9097a5; --faint:#6a7180;
  --accent:#6e9cff; --accent-ink:#0b1220; --accent-soft:#1a2641;
  --live:#ff5a4f; --live-soft:#3a1816; --ok:#3ccf86; --warn:#f0b04a; --warn-soft:#33260f;
  --btn:#1d2129; --btn-h:#262b35; --btn-a:#2f3541;
  --stage:#07080b; --shadow:0 1px 2px rgba(2,8,24,.5),0 6px 18px rgba(2,8,24,.35);
  --sel:#2a3c66;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font:14px/1.45 "Geist","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  display:grid;grid-template-rows:48px minmax(0,1fr) 116px;
  overflow:hidden;font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--sel)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--faint);background-clip:content-box;border:2px solid transparent}
::-webkit-scrollbar-track{background:transparent}
.ph{font-size:18px;line-height:1;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
header{display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:650;letter-spacing:-.01em;font-size:15px}
.event{position:relative;display:inline-flex;align-items:center}
.event-btn{
  display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 8px 0 10px;border-radius:8px;
  font:inherit;font-weight:550;color:var(--text);background:none;border:0;cursor:pointer;
}
.event-btn:hover,.event-btn[aria-expanded="true"]{background:var(--btn)}
.event-btn .ph{font-size:14px;color:var(--muted)}
.event-input{
  height:32px;width:220px;padding:0 10px;border-radius:8px;font:inherit;color:var(--text);
  background:var(--panel);border:1px solid var(--accent);
}
.event-input::placeholder{color:var(--faint)}
.menu{
  position:absolute;top:calc(100% + 6px);left:0;min-width:230px;padding:6px;z-index:5;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
}
.menu[hidden]{display:none}
.menu button{
  display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:0;border-radius:8px;
  font:inherit;color:var(--text);background:none;text-align:left;cursor:pointer;
}
.menu button:hover{background:var(--btn)}
.menu .chk{width:16px;font-size:16px;color:var(--accent);flex:none}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.empty-lib{padding:8px 10px;color:var(--faint);font-size:13px}
.grow{flex:1}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.status b{color:var(--text);font-weight:600}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:40px;padding:0 16px;border-radius:8px;
  font:inherit;font-weight:550;color:var(--text);
  background:var(--btn);border:1px solid var(--line);cursor:pointer;
  transition:background .15s,border-color .15s,transform .1s;
}
.btn:hover{background:var(--btn-h)}
.btn:active{background:var(--btn-a);transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.icon{width:32px;height:32px;padding:0;border-radius:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);min-width:150px;height:44px;font-size:15px}
.btn.primary:hover{filter:brightness(1.08)}
.btn.toggle[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.btn.toggle.black[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--bg)}
kbd{font:inherit;font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 5px;line-height:17px}
.primary kbd{color:inherit;border-color:color-mix(in srgb,currentColor 40%,transparent);opacity:.8}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--btn);padding:3px;height:40px}
.seg button{font:inherit;font-weight:550;color:var(--muted);background:none;border:0;border-radius:6px;padding:0 14px;cursor:pointer}
.seg button:hover{color:var(--text)}
.seg button[aria-checked="true"]{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}

/* main */
main{display:grid;grid-template-columns:248px minmax(0,1fr) 300px;min-height:0}
aside,.stage-col{min-height:0;overflow:auto}
.left{background:var(--side);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:10px}
.right{background:var(--side);border-left:1px solid var(--line);padding:14px}
.stage-col{padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.panel-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);padding:0 4px}
.panel-h .grow{flex:1}
.panel-h .count{font-weight:500;color:var(--faint)}

/* library */
.decks{display:flex;flex-direction:column;gap:2px}
.deck{
  display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:8px;
  padding:8px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent;
}
.deck:hover{background:var(--btn)}
.deck[aria-current="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.deck .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deck .meta{font-size:12px;color:var(--faint)}
.deck.dragging{opacity:.4}
.deck.busy{cursor:default}
.deck .bar{grid-column:2/4;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.deck .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s linear}
.deck.err{color:var(--live)}
.deck.err .meta{color:var(--live)}
.drop{
  margin-top:auto;border:1.5px dashed var(--line);border-radius:12px;padding:14px;
  display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:13px;
}
.drop b{display:block;color:var(--text);font-weight:600}

/* slides */
.slide{
  container-type:inline-size;aspect-ratio:16/9;width:100%;border-radius:6px;overflow:hidden;
  position:relative;
  color:#fff;background:linear-gradient(135deg,hsl(var(--h) 55% 32%),hsl(calc(var(--h) + 30) 60% 20%));
}
.slide.light{color:hsl(var(--h) 40% 15%);background:hsl(var(--h) 40% 94%)}
.slide .in{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:4cqw;padding:7cqw}
.slide.end .in{align-items:center;text-align:center}
.slide .t{font-size:7cqw;font-weight:680;line-height:1.1;letter-spacing:-.02em;text-wrap:balance;max-width:80%}
.slide ul{list-style:none;padding:0;display:grid;gap:2cqw}
.slide li{font-size:3.6cqw;opacity:.85;display:flex;gap:2cqw;align-items:center}
.slide li::before{content:"";width:1.2cqw;height:1.2cqw;border-radius:50%;background:currentColor;opacity:.6;flex:none}
.slide .big{font-size:20cqw;font-weight:700;letter-spacing:-.04em;line-height:1}
.slide .sub{font-size:4cqw;opacity:.8}
.slide.end{background:var(--btn);color:var(--faint);align-items:center;text-align:center;font-size:3.6cqw}
.slide.end .t{font-size:4.5cqw;font-weight:600;color:var(--muted)}

/* program */
.program{
  position:relative;flex:1;min-height:180px;container-type:size;
  display:flex;align-items:center;justify-content:center;
  background:var(--stage);border-radius:12px;padding:10px;box-shadow:var(--shadow);border:1px solid var(--line);
}
.program[data-state="live"]{border-color:color-mix(in srgb,var(--live) 70%,var(--line))}
.program[data-state="frozen"]{border-color:var(--warn)}
.screen{
  position:relative;border-radius:8px;overflow:hidden;background:#000;
  aspect-ratio:16/9;width:min(100cqw,calc(100cqh*16/9));
}
.screen .slide{transition:opacity .25s cubic-bezier(.2,.7,.2,1)}
.screen.fading .slide{opacity:0}
.shade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s}
.screen[data-black="true"] .shade{opacity:1}
.tally{
  position:absolute;top:12px;left:12px;z-index:1;display:flex;gap:8px;align-items:center;
  font-size:12px;font-weight:650;letter-spacing:.04em;padding:4px 10px;border-radius:99px;
  background:var(--live);color:#fff;
}
.tally::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
.program[data-state="frozen"] .tally{background:var(--warn);color:#1a1200}
.program[data-state="black"] .tally,.program[data-state="idle"] .tally{background:#2a2e37;color:#d6d9e0}

.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.controls .grow{flex:1}

/* next */
.next-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:10px}
.next-card .slide{border-radius:5px}
.next-card .cap{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;padding:0 2px}
.notes{margin-top:18px}
.notes p{margin-top:8px;padding:0 4px;color:var(--text);font-size:15px;line-height:1.55;white-space:pre-wrap;max-width:60ch}
.notes p:empty::before{content:"Tidak ada catatan untuk slide ini.";color:var(--faint)}

/* strip */
footer{background:var(--panel);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:12px;overflow-x:auto;align-items:center}
.th{
  flex:0 0 150px;position:relative;border-radius:8px;padding:3px;cursor:pointer;
  border:2px solid transparent;background:none;
}
.th:hover{background:var(--btn)}
.th .n{position:absolute;left:10px;bottom:9px;font-size:11px;font-weight:650;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;padding:0 5px}
.th[data-role="live"]{border-color:var(--live)}
.th[data-role="next"]{border-color:var(--accent)}
.th.dragging{opacity:.4}
.th.over{outline:2px dashed var(--accent);outline-offset:2px}
.empty{color:var(--faint);padding:0 8px}

/* drop overlay */
.overlay{
  position:fixed;inset:12px;border:2px dashed var(--accent);border-radius:14px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(2px);
  display:none;place-items:center;font-size:18px;font-weight:600;color:var(--accent);z-index:10;
}
.overlay.on{display:grid}
.overlay span{display:flex;gap:10px;align-items:center}

@media (max-width:1400px){.controls kbd{display:none}.btn.primary{min-width:120px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <span class="brand">PPT Share</span>
  <div class="event">
    <button class="event-btn" id="eventBtn" aria-haspopup="menu" aria-expanded="false">
      <span id="eventName"></span><i class="ph ph-caret-down"></i>
    </button>
    <input class="event-input" id="eventNew" placeholder="Nama event baru" maxlength="60" hidden aria-label="Nama event baru">
    <div class="menu" id="eventMenu" role="menu" hidden></div>
  </div>
  <span class="grow"></span>
  <div class="status"><span class="dot"></span><span>NDI <b>PPT Share</b> · 1920×1080 · 30 fps</span></div>
  <button class="btn icon" id="theme" aria-label="Ganti tema"><i class="ph ph-sun"></i></button>
</header>

<main>
  <aside class="left">
    <div class="panel-h">Library <span class="grow"></span><span class="count" id="deckCount"></span></div>
    <div class="decks" id="decks"></div>
    <div class="drop">
      <i class="ph ph-upload-simple"></i>
      <div><b>Tambah file</b>Seret PPTX atau PDF ke mana saja di jendela ini.</div>
    </div>
  </aside>

  <section class="stage-col">
    <div class="program" id="program" data-state="live">
      <div class="screen" id="screen" data-black="false">
        <div id="out"></div>
        <div class="shade"></div>
        <span class="tally" id="tally">LIVE</span>
      </div>
    </div>
    <div class="controls">
      <button class="btn" id="prev"><i class="ph ph-caret-left"></i>Prev <kbd>←</kbd></button>
      <button class="btn primary" id="next">Next <i class="ph ph-caret-right"></i><kbd>Space</kbd></button>
      <span class="grow"></span>
      <div class="seg" role="radiogroup" aria-label="Transisi">
        <button role="radio" aria-checked="true" data-t="cut">Cut</button>
        <button role="radio" aria-checked="false" data-t="fade">Fade</button>
      </div>
      <button class="btn toggle" id="freeze" aria-pressed="false"><i class="ph ph-pause"></i>Freeze <kbd>F</kbd></button>
      <button class="btn toggle black" id="black" aria-pressed="false"><i class="ph ph-eye-slash"></i>Black <kbd>B</kbd></button>
    </div>
  </section>

  <aside class="right">
    <div class="panel-h">Slide berikutnya <span class="grow"></span><span class="count" id="pos"></span></div>
    <div class="next-card" style="margin-top:8px">
      <div id="nx"></div>
      <div class="cap"><span id="nxTitle"></span></div>
    </div>
    <div class="notes">
      <div class="panel-h">Catatan</div>
      <p id="notes"></p>
    </div>
  </aside>
</main>

<footer id="thumbs"></footer>

<div class="overlay" id="overlay"><span><i class="ph ph-upload-simple"></i>Lepas file untuk menambah ke Library</span></div>

<script>
const $=id=>document.getElementById(id);
let decks=[
  {n:"Opening MC",h:215,s:[
    {k:"title",t:"Selamat datang",sub:"Gala Dinner 2026"},
    {k:"list",t:"Rangkaian acara",l:["Pembukaan","Sambutan","Makan malam"]},
    {k:"title",t:"Terima kasih kepada sponsor",sub:""}],
   notes:["Sambut tamu. Sebut nama pembawa acara.","Jelaskan urutan acara, sekitar 2 menit.","Panggil perwakilan sponsor ke panggung."]},
  {n:"Speaker A – Keynote",h:205,s:[
    {k:"title",t:"Arah strategi 2027",sub:"Keynote"},
    {k:"list",t:"Latar belakang",l:["Pasar bergeser","Pelanggan berubah","Kompetitor bergerak"]},
    {k:"big",t:"Pertumbuhan tahunan",big:"+32%"},
    {k:"list",t:"Tiga prioritas",l:["Produk","Distribusi","Tim"]},
    {k:"light",t:"Roadmap 12 bulan",l:["Q1 Peluncuran","Q2 Ekspansi","Q3 Optimasi"]},
    {k:"title",t:"Tanya jawab",sub:""},
    {k:"title",t:"Terima kasih",sub:""}],
   notes:["Mulai dengan cerita singkat.","Tiga poin, jangan dibaca satu per satu.","Sebutkan sumber data: laporan internal 2025.","Tekankan prioritas pertama.","","Buka sesi tanya jawab, 10 menit.",""]},
  {n:"Speaker B – Produk",h:160,s:[
    {k:"title",t:"Produk baru",sub:"Speaker B"},
    {k:"list",t:"Fitur utama",l:["Cepat","Sederhana","Aman"]},
    {k:"big",t:"Waktu setup",big:"5 mnt"},
    {k:"light",t:"Paket harga",l:["Starter","Team","Business"]}],
   notes:["","Demo singkat setelah slide ini.","","Arahkan tamu ke meja registrasi."]}
];
const events=[{n:"Gala Dinner 2026",decks,d:1,cur:0},{n:"Seminar Q3",decks:[],d:0,cur:0}];
let ei=0,d=1,cur=0,frozen=false,black=false,fade=false,out=null;

function slideEl(x,h){
  const w=document.createElement("div");
  const k=x.k;
  w.className="slide"+(k=="light"?" light":"");
  w.style.setProperty("--h",h);
  let html=`<div class="t">${x.t}</div>`;
  if(k=="list"||k=="light") html+=`<ul>${x.l.map(i=>`<li>${i}</li>`).join("")}</ul>`;
  if(k=="title"&&x.sub) html+=`<div class="sub">${x.sub}</div>`;
  if(k=="big") html=`<div class="sub">${x.t}</div><div class="big">${x.big}</div>`;
  w.innerHTML=`<div class="in">${html}</div>`;
  return w;
}
function endCard(label,sub){
  const w=document.createElement("div");w.className="slide end";
  w.innerHTML=`<div class="in"><div class="t">${label}</div>${sub?`<div>${sub}</div>`:""}</div>`;return w;
}
const ready=()=>!!(decks[d]&&decks[d].s);

function renderLibrary(){
  $("deckCount").textContent=decks.length+" deck";
  $("decks").innerHTML=decks.length?"":'<div class="empty-lib">Belum ada deck di event ini.</div>';
  decks.forEach((x,i)=>{
    const el=document.createElement("div");
    el.className="deck"+(x.busy?" busy":"")+(x.err?" err":"");
    el.draggable=!x.busy;
    if(i==d&&!x.busy&&!x.err)el.setAttribute("aria-current","true");
    el.innerHTML=`<i class="ph ph-${x.err?'warning-circle':'file'}"></i>
      <span class="name">${x.n}</span>
      <span class="meta">${x.err?"Tidak didukung":x.busy?"Mengonversi":x.s.length+" slide"}</span>
      ${x.busy?`<span class="bar"><i style="width:${x.p||0}%"></i></span>`:""}`;
    if(!x.busy&&!x.err)el.onclick=()=>{d=i;cur=0;go(0,true)};
    if(x.err)el.onclick=()=>{decks.splice(i,1);if(d>i)d--;renderLibrary()};
    el.ondragstart=e=>{e.dataTransfer.setData("text/deck",i);el.classList.add("dragging")};
    el.ondragend=()=>el.classList.remove("dragging");
    el.ondragover=e=>{if(e.dataTransfer.types.includes("text/deck"))e.preventDefault()};
    el.ondrop=e=>{
      const from=e.dataTransfer.getData("text/deck");
      if(from==="")return;e.preventDefault();e.stopPropagation();
      const cd=decks[d];const [m]=decks.splice(+from,1);decks.splice(i,0,m);d=decks.indexOf(cd);renderLibrary();
    };
    $("decks").appendChild(el);
  });
}

function renderThumbs(){
  const cont=$("thumbs");cont.innerHTML="";
  const dk=decks[d];
  if(!dk||!dk.s){cont.innerHTML=`<span class="empty">${decks.length?"Pilih deck di Library.":"Belum ada slide."}</span>`;return}
  dk.s.forEach((x,i)=>{
    const t=document.createElement("div");t.className="th";t.draggable=true;
    t.dataset.role=i==cur?"live":i==cur+1?"next":"";
    t.appendChild(slideEl(x,dk.h));
    t.insertAdjacentHTML("beforeend",`<span class="n">${i+1}</span>`);
    t.onclick=()=>go(i);
    t.ondragstart=e=>{e.dataTransfer.setData("text/slide",i);t.classList.add("dragging")};
    t.ondragend=()=>t.classList.remove("dragging");
    t.ondragover=e=>{if(e.dataTransfer.types.includes("text/slide")){e.preventDefault();t.classList.add("over")}};
    t.ondragleave=()=>t.classList.remove("over");
    t.ondrop=e=>{
      const from=e.dataTransfer.getData("text/slide");if(from==="")return;
      e.preventDefault();e.stopPropagation();
      const [m]=dk.s.splice(+from,1);const [n]=dk.notes.splice(+from,1);
      dk.s.splice(i,0,m);dk.notes.splice(i,0,n);cur=i;render();
    };
    cont.appendChild(t);
  });
  cont.querySelector('[data-role="live"]')?.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
}

function renderSide(){
  const dk=decks[d];
  const nx=$("nx");nx.innerHTML="";
  if(!ready()){
    $("pos").textContent="";nx.appendChild(endCard("Belum ada slide"));
    $("nxTitle").textContent="";$("notes").textContent="";return;
  }
  $("pos").textContent=`${cur+1} / ${dk.s.length}`;
  const nxt=dk.s[cur+1];
  if(nxt){nx.appendChild(slideEl(nxt,dk.h));$("nxTitle").textContent=nxt.t}
  else{
    const nd=decks.slice(d+1).find(x=>x.s);
    nx.appendChild(endCard(nd?"Akhir deck":"Akhir deck"));
    $("nxTitle").textContent=nd?"Berikutnya: "+nd.n:"Tidak ada deck berikutnya";
  }
  $("notes").textContent=(dk.notes&&dk.notes[cur])||"";
}

function renderOut(animate){
  const screen=$("screen"),o=$("out");
  const put=()=>{o.innerHTML="";o.appendChild(out?slideEl(out.x,out.h):endCard("Belum ada slide","Seret file PPTX atau PDF ke jendela ini"))};
  if(animate&&fade&&out){screen.classList.add("fading");setTimeout(()=>{put();screen.classList.remove("fading")},250)}
  else put();
  screen.dataset.black=black;
  const state=!out?"idle":black?"black":frozen?"frozen":"live";
  $("program").dataset.state=state;
  $("tally").textContent=!out?"STANDBY":black?"BLACK":frozen?"FROZEN":"LIVE";
}

function render(animate){
  if(!frozen&&ready())out={x:decks[d].s[cur],h:decks[d].h};
  renderLibrary();renderThumbs();renderSide();renderOut(animate);
  $("prev").disabled=!ready()||(cur==0&&!decks.slice(0,d).some(x=>x.s));
  $("next").disabled=!ready();
  $("freeze").setAttribute("aria-pressed",frozen);
  $("black").setAttribute("aria-pressed",black);
}
function go(i,animate=true){cur=i;render(animate)}
function next(){
  if(!ready())return;
  const dk=decks[d];
  if(cur<dk.s.length-1)return go(cur+1);
  const ni=decks.findIndex((x,j)=>j>d&&x.s);
  if(ni>-1){d=ni;go(0)}
}
function prev(){
  if(!ready())return;
  if(cur>0)return go(cur-1);
  for(let j=d-1;j>=0;j--)if(decks[j].s){d=j;return go(decks[j].s.length-1)}
}
$("next").onclick=next;$("prev").onclick=prev;
$("freeze").onclick=()=>{frozen=!frozen;render(false)};
$("black").onclick=()=>{black=!black;render(false)};
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
  fade=b.dataset.t=="fade";
  document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-checked",x==b));
});
addEventListener("keydown",e=>{
  if(e.target.tagName=="INPUT"||e.target.tagName=="SELECT")return;
  if(e.key=="ArrowRight"||e.key==" "){e.preventDefault();next()}
  else if(e.key=="ArrowLeft"){e.preventDefault();prev()}
  else if(e.key.toLowerCase()=="f")$("freeze").click();
  else if(e.key.toLowerCase()=="b")$("black").click();
});

/* import: drop files anywhere */
const ov=$("overlay");let depth=0;
const hasFiles=e=>e.dataTransfer&&[...e.dataTransfer.types].includes("Files");
addEventListener("dragenter",e=>{if(hasFiles(e)){depth++;ov.classList.add("on")}});
addEventListener("dragleave",e=>{if(hasFiles(e)&&--depth<=0){depth=0;ov.classList.remove("on")}});
addEventListener("dragover",e=>{if(hasFiles(e))e.preventDefault()});
addEventListener("drop",e=>{
  if(!hasFiles(e))return;
  e.preventDefault();depth=0;ov.classList.remove("on");
  [...e.dataTransfer.files].forEach(f=>{
    const ok=/\.(pptx?|pdf)$/i.test(f.name);
    const x={n:f.name.replace(/\.\w+$/,""),h:Math.floor(Math.random()*360),busy:ok,err:!ok,p:0};
    decks.push(x);
    if(ok){
      const iv=setInterval(()=>{
        x.p+=12+Math.random()*15;
        if(x.p>=100){
          clearInterval(iv);x.busy=false;
          x.s=[{k:"title",t:x.n,sub:""},{k:"list",t:"Slide 2",l:["Poin satu","Poin dua","Poin tiga"]},{k:"big",t:"Slide 3",big:"42"},{k:"title",t:"Slide 4",sub:""}];
          x.notes=["","","",""];
          if(decks.includes(x)&&!ready()){d=decks.indexOf(x);cur=0}
          render(false);
        }
        renderLibrary();
      },220);
    }
  });
  renderLibrary();
});

/* event menu */
const eBtn=$("eventBtn"),eMenu=$("eventMenu"),eNew=$("eventNew");
function switchEvent(i){
  events[ei].d=d;events[ei].cur=cur;
  ei=i;decks=events[i].decks;d=events[i].d;cur=events[i].cur;
  $("eventName").textContent=events[i].n;
  render(false);
}
function openMenu(open){
  eMenu.hidden=!open;eBtn.setAttribute("aria-expanded",open);
  if(!open)return;
  eMenu.innerHTML=events.map((ev,i)=>`<button role="menuitem" data-i="${i}"><i class="ph ph-check chk" style="visibility:${i==ei?"visible":"hidden"}"></i>${ev.n.replace(/</g,"&lt;")}</button>`).join("")
    +`<hr><button role="menuitem" data-new><i class="ph ph-plus chk" style="color:var(--muted)"></i>Event baru</button>`;
}
function startNew(){
  openMenu(false);eBtn.hidden=true;eNew.hidden=false;eNew.value="";eNew.focus();
}
function endNew(commit){
  const n=eNew.value.trim();
  eNew.hidden=true;eBtn.hidden=false;
  if(commit&&n){events.push({n,decks:[],d:0,cur:0});switchEvent(events.length-1)}
}
eBtn.onclick=()=>openMenu(eMenu.hidden);
eMenu.onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  if("new" in b.dataset)return startNew();
  openMenu(false);switchEvent(+b.dataset.i);
};
eNew.onkeydown=e=>{if(e.key=="Enter")endNew(true);else if(e.key=="Escape")endNew(false)};
eNew.onblur=()=>{if(!eNew.hidden)endNew(true)};
addEventListener("click",e=>{if(!e.target.closest(".event"))openMenu(false)});
addEventListener("keydown",e=>{if(e.key=="Escape"&&!eMenu.hidden)openMenu(false)});

/* theme */
const root=document.documentElement;
function setTheme(t){
  root.dataset.theme=t;
  $("theme").innerHTML=`<i class="ph ph-${t=="dark"?"sun":"moon"}"></i>`;
  try{localStorage.setItem("theme",t)}catch(e){}
}
let t0;try{t0=localStorage.getItem("theme")}catch(e){}
setTheme(t0||"dark");
$("theme").onclick=()=>setTheme(root.dataset.theme=="dark"?"light":"dark");

$("eventName").textContent=events[0].n;
render(false);
</script>
</body>
